<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота №2 | Стилізація форми</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Практична робота №2: Стилізація веб-форми</h1>
            <p>Роман Шовковий, група КІД-42</p>
            <nav>
                <ul>
                    <li><a href="../index.html">← На головну</a></li>
                    <li><a href="practice1.html">Практична №1</a></li>
                    <li><a href="../labs/lab1.html">Лабораторна №1</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="form-wrapper">
        <!-- 
            Стилізована веб-форма з Лабораторної роботи №1
            (Класи custom-form, form-field, submit-btn задають необхідні параметри)
        -->
        <form class="custom-form" action="https://webhook.site/YOUR-UNIQUE-UUID" method="POST">
            <h2 class="form-title">Реєстрація користувача</h2>
            <p class="form-subtitle">Заповніть обов'язкові поля, позначені (*)</p>
            
            <div class="form-field">
                <label for="firstName">Ім'я *:</label>
                <input type="text" id="firstName" name="firstName" placeholder="Введіть ваше ім'я" required>
            </div>

            <div class="form-field">
                <label for="lastName">Прізвище *:</label>
                <input type="text" id="lastName" name="lastName" placeholder="Введіть ваше прізвище" required>
            </div>

            <div class="form-field">
                <label for="userEmail">Адреса електронної пошти *:</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="example@mail.com" required>
            </div>

            <div class="form-field">
                <label for="userPassword">Пароль *:</label>
                <input type="password" id="userPassword" name="userPassword" placeholder="Мінімум 6 символів" required minlength="6">
            </div>

            <div class="form-field">
                <label for="confirmPassword">Підтвердження паролю *:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторіть пароль" required minlength="6">
            </div>

            <div class="form-field">
                <label for="birthDate">Дата народження:</label>
                <input type="date" id="birthDate" name="birthDate">
            </div>

            <div class="form-field">
                <label for="gender">Стать:</label>
                <select id="gender" name="gender">
                    <option value="">-- Оберіть стать --</option>
                    <option value="male">Чоловіча</option>
                    <option value="female">Жіноча</option>
                    <option value="other">Інше</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Зареєструватися</button>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Роман Шовковий (КІД-42) | <a href="mailto:st8462708@stud.duikt.edu.ua">st8462708@stud.duikt.edu.ua</a></p>
        </div>
    </footer>

</body>
</html>
